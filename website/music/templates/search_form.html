<form method="get" action="{% url 'search' %}">
    <input type="text" name="q" placeholder="search..." value="{{ query }}" maxlength="20">
    <select name="type">
        <option value="song" {% if search_type == 'song' %}selected{% endif %}>song</option>
        <option value="artist" {% if search_type == 'artist' %}selected{% endif %}>artist</option>
    </select>
    <button type="submit">search!</button>
</form>
