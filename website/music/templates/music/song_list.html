{% extends 'base.html' %}

{% block content %}

<h1>Songs</h1>

<div class="row">
    <ul>
        {% for song in songs %}
        <li><a href={{ song.get_detail_page }}>{{ song.name }}<a></li>
        {% endfor %}
    </ul>
</div>

<div class="pagination">
    <span class="step-links">
        {% if songs.has_previous %}
            <a href="?page=1">first</a>
            <a href="?page={{ songs.previous_page_number }}">previous</a>
        {% endif %}

        <span class="current">
            Page {{ songs.number }} of {{ songs.paginator.num_pages }}.
        </span>

        {% if songs.has_next %}
            <a href="?page={{ songs.next_page_number }}">next</a>
            <a href="?page={{ songs.paginator.num_pages }}">last</a>
        {% endif %}
    </span>
</div>

{% endblock %}
