{% extends 'base.html' %}

{% block content %}

<h1>{{ song.name }}</h1>

<style>

</style>

<div id="cover_img">
    <img src={{ song.get_img_path }} style="max-width: 300px; max-height: 300px;">
</div>

<div id="origin_url">
    <a href={{ song.origin_url }}>网易云歌曲页面</a>
</div>

<div id="artist">
    <p>歌手：</p>
    <ul>
        {% for artist in artists %}
        <li>
            <img src={{ artist.get_img_path }} style="max-width: 60px; max-height: 60px;">
            <a href={{ artist.get_detail_page }}>{{ artist.name }}</a>
        </li>
        {% endfor %}
    </ul>
</div>

<div class="lyrics-container">
    <p>歌词：</p>
    <div class="lyrics-preview">
        <p>{{ song.lyric | truncatechars:300 | linebreaks }}</p>
    </div>
    <div class="lyrics-full" style="display: none;">
        <p>{{ song.lyric | linebreaks }}</p>
    </div>
    <button class="toggle-lyrics" onclick="toggleFullLyrics()">显示完整歌词</button>
</div>

<script>
function toggleFullLyrics() {
    const preview = document.querySelector('.lyrics-preview');
    const full = document.querySelector('.lyrics-full');
    const btn = document.querySelector('.toggle-lyrics');
    
    if (full.style.display === 'none') {
        preview.style.display = 'none';
        full.style.display = 'block';
        btn.textContent = '收起歌词';
    } else {
        preview.style.display = 'block';
        full.style.display = 'none';
        btn.textContent = '显示完整歌词';
    }
}
</script>

{% endblock %}
